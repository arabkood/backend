version: 0.2

phases:
  install:
    runtime-versions:
      golang: 1.24
  build:
    commands:
      - echo "Build started on $(date)"
      - echo "Compiling the Go code..."
      - CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -o main ./cmd/server/main.go
      - echo "Build completed on $(date)"
artifacts:
  files:
    # These files become the source bundle for CodeDeploy
    - main
    - appspec.yml
    - scripts/**/*
    - config/config.dev.yaml
  # discard-paths: yes # Optional: flattens the structure in the artifact zip
